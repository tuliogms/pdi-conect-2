}@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media(max-width:550px){.header{gap:8px}.logos{gap:9px}.divider{height:30px}.skip{font-size:11px;padding:10px 11px}.composition{min-height:320px}.orbit{width:255px;height:255px}.orbit.second{width:300px;height:300px}.s1{left:calc(50% - 112px);top:25px}.s2{right:calc(50% - 140px);top:90px}.s3{left:calc(50% - 138px);bottom:83px}.s4{right:calc(50% - 102px);bottom:25px}.small-star{right:calc(50% - 105px);top:25px}.icon{width:60px;height:60px}.message{margin-top:16px}.footer-label{font-size:9px}.progress{width:120px}}@media(max-height:600px){.composition{min-height:260px}.orbit{width:245px;height:245px}.orbit.second{width:280px;height:280px}.icon{width:48px;height:48px}.title{font-size:80px}.message{margin-top:10px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}.progress:after{transform:scaleX(1)}}

.title{overflow:visible;animation:rise .65s .25s forwards}.title .letter{display:inline-block;position:relative;transform-origin:50% 95%}.title .letter-p{animation:letter-bounce .7s 1.6s both}.title .letter-d{animation:letter-bounce .7s 1.8s both}.title .letter-i{animation:i-settle .55s 2.48s both}.dot-character{display:block;position:absolute;z-index:3;width:.14em;height:.14em;border-radius:50%;background:#f5c72c;left:50%;top:-.12em;box-shadow:inset -.012em -.016em 0 #e0a927;opacity:0;animation:character 2.3s .55s forwards}.dot-character:before,.dot-character:after{content:"";position:absolute;top:37%;width:9%;height:9%;border-radius:50%;background:#8b7122}.dot-character:before{left:30%}.dot-character:after{right:30%}.orbit{animation:orbit-in 1.8s .3s ease-out both}.s1,.s2,.s3,.s4,.small-star{animation-delay:2.65s}.icon{animation:rise .6s 2.35s forwards}.interativo{animation:rise .65s 2.55s forwards}.message{animation:rise .7s 3s forwards}@keyframes letter-bounce{0%{transform:translateY(0)}35%{transform:translateY(-.055em) rotate(-3deg)}65%{transform:translateY(.01em) scaleY(.96)}100%{transform:translateY(0) scaleY(1)}}@keyframes i-settle{0%{transform:scaleY(1)}35%{transform:scaleY(.89)}75%{transform:scaleY(1.04)}100%{transform:scaleY(1)}}@keyframes character{0%{opacity:0;transform:translate(2.35em,-.15em) scale(1)}8%{opacity:1;transform:translate(2em,-.15em) scale(1)}28%{opacity:1;transform:translate(1.3em,.42em) scale(1.22,.8)}45%{opacity:1;transform:translate(.68em,-.55em) scale(.92,1.08)}64%{opacity:1;transform:translate(.08em,.05em) scale(1.2,.8)}79%{opacity:1;transform:translate(-.5em,-.35em) scale(.95,1.05)}94%{opacity:1;transform:translate(-.5em,.02em) scale(1.18,.8)}100%{opacity:1;transform:translate(-.095em,0) scale(1)}}

.title{display:flex;align-items:baseline;justify-content:center;gap:.012em;animation:rise .65s .15s forwards}.title .big-i{display:inline-block;position:relative;width:.30em;height:.91em;color:#ef5c3c}.big-i-stem{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:.19em;height:.60em;border-radius:.045em;background:#ef5c3c;transform-origin:bottom;animation:stem-bop .55s 2.8s both}.jump-dot{position:absolute;display:block;width:.19em;height:.19em;left:50%;top:.02em;border-radius:50%;background:#f5c72c;box-shadow:inset -.015em -.02em 0 #dea91c,0 .025em .05em #a77e2030;opacity:0;animation:jump-onto-i 2.65s .3s both}.jump-dot:before,.jump-dot:after{content:"";position:absolute;width:.013em;height:.019em;top:36%;background:#776219;border-radius:50%}.jump-dot:before{left:29%}.jump-dot:after{right:29%}.title .letter-p{animation:letter-bounce .6s 1.5s both}.title .letter-d{animation:letter-bounce .6s 1.8s both}.s1,.s2,.s3,.s4,.small-star{animation-delay:2.9s}.interativo{animation:rise .65s 2.7s forwards}.message{animation:rise .65s 3.15s forwards}.icon{animation:rise .6s .45s forwards}@keyframes jump-onto-i{0%{opacity:0;transform:translate(2.5em,-.3em) scale(1)}6%{opacity:1;transform:translate(2.2em,-.3em) scale(.9,1.1)}22%{opacity:1;transform:translate(1.6em,.42em) scale(1.28,.74)}39%{opacity:1;transform:translate(.9em,-.58em) scale(.88,1.12)}56%{opacity:1;transform:translate(.42em,.38em) scale(1.25,.78)}72%{opacity:1;transform:translate(.04em,-.45em) scale(.9,1.1)}88%{opacity:1;transform:translate(-.095em,.04em) scale(1.3,.72)}95%{opacity:1;transform:translate(-.095em,-.1em) scale(.95,1.05)}100%{opacity:1;transform:translate(-.095em,0) scale(1)}}@keyframes stem-bop{0%{transform:translateX(-50%) scaleY(1)}35%{transform:translateX(-50%) scaleY(.83)}70%{transform:translateX(-50%) scaleY(1.06)}100%{transform:translateX(-50%) scaleY(1)}}@media(prefers-reduced-motion:reduce){.jump-dot{animation:none!important;opacity:1;transform:translate(-.095em,0)}}
